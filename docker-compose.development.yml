version: '3.8'

services:
  financial-ai-agents:
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - ENABLE_RELOAD=true
      - ENABLE_PROFILING=true
    volumes:
      - .:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]