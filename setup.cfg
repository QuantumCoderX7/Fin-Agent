[flake8]
max-line-length = 120
extend-ignore = 
    # These rules conflict with black
    E203,  # whitespace before ':'
    W503,  # line break before binary operator
    # Docstring rules we're ignoring for now
    D100,  # Missing docstring in public module
    D104,  # Missing docstring in public package
    D105,  # Missing docstring in magic method
    D107,  # Missing docstring in __init__
    # Function rules we're relaxing
    C901,  # Function is too complex
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    *.egg-info,
    .venv,
    venv,
    frontend,
    docs
per-file-ignores =
    # Allow unused imports in __init__.py files
    __init__.py: F401
    # Allow long lines in settings files
    */config/settings.py: E501
    # Allow unused imports in test files
    tests/*: F401,F811

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 120
skip = .git,__pycache__,build,dist,*.egg-info,.venv,venv,frontend,docs
skip_glob = **/migrations/*
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
known_first_party = app
default_section = THIRDPARTY