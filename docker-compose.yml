version: '3.8'

services:
  financial-ai-agents:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PHI_API_KEY=${PHI_API_KEY}
      - DEBUG=false
      - LOG_LEVEL=INFO
      - APP_NAME=Financial AI Agents
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=["*"]
      - DEFAULT_MODEL=qwen/qwen3-32b
      - MAX_SOURCES=10
      - REQUEST_TIMEOUT=300
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - financial-ai-network

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - financial-ai-agents
    restart: unless-stopped
    networks:
      - financial-ai-network
    profiles:
      - production

networks:
  financial-ai-network:
    driver: bridge

volumes:
  logs:
    driver: local